[project]
name = "swe-agent"
version = "0.1.0"
description = "AI Software Engineering Agent: reads a codebase, understands it, fixes a bug or adds a feature, and verifies nothing broke."
requires-python = ">=3.10"
dependencies = [
    "GitPython>=3.1",
    "requests>=2.31",
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
swe-agent = "swe_agent.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["swe_agent*"]
